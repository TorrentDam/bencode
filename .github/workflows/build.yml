name: build

on: [push]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Set up java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Build JVM
      run: ./mill bencode.jvm.test

    - name: Build JS
      run: ./mill bencode.js.test

    - name: Build native
      run: ./mill bencode.native.test

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SONATYPE_CREDS: ${{ secrets.SONATYPE_CREDS }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.PGP_SECRET_KEY }}
        run: |
          export VERSION=${GITHUB_REF#*/v}
          export MILL_SONATYPE_USERNAME=${SONATYPE_CREDS%%:*}
          export MILL_SONATYPE_PASSWORD=${SONATYPE_CREDS#*:}
          echo Publishing $VERSION
          ./mill mill.javalib.SonatypeCentralPublishModule/
